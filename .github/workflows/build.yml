# Builds WinMorph on Windows, runs the self-test and renders screenshots of every look.
# On main, a version in Directory.Build.props without a tag yet publishes a GitHub release;
# the website (winmorph.benjaminberger.at) and the in-app updater pick it up from there.
name: Build & Release

on:
  push:
    paths-ignore: ["**.md", "website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT
          $new = "${{ github.ref }}" -eq "refs/heads/main" -and -not (git ls-remote --tags origin "refs/tags/v$v")
          "release=$($new.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "WinMorph $v (release: $new)"

      - name: Build WinMorph
        run: dotnet build WinMorph.csproj -c Release -o build -nologo

      - name: Build setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" Setup/WinMorph.iss
          if ($LASTEXITCODE) { throw "setup build failed" }

      - name: Installer smoke test
        run: ./Setup/test.ps1

      - name: Self-test
        run: |
          $p = Start-Process build\WinMorph.exe -ArgumentList "--selftest", "$pwd\selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test hung" }
          Get-Content selftest.txt
          # the update and backup checks must pass; reading the runner's own lock screen picture may not work there
          $bad = Select-String -Path selftest.txt -Pattern '^FAIL' | Where-Object { $_.Line -notmatch 'lock screen picture' }
          if ($bad) { throw "self-test failed" }

      - name: Screenshots
        env:
          WINMORPH_DEMO_APPS: "Firefox;Google Chrome;Microsoft Edge;File Explorer;Calculator;Command Prompt;Windows PowerShell;Notepad;Paint;Visual Studio Code;Task Manager;Control Panel;Snipping Tool;Settings;Character Map;Git Bash;Windows Media Player;Remote Desktop Connection;Steam;Spotify;Microsoft Store;Photos;Camera;Clock;Weather;Mail;Calendar;Maps;Terminal;Windows Terminal"
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          # the runner's screen is 1024×768; the app window (1320×840) needs more room
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Warning "resolution: $_" }
          function Shot([string[]]$a) {
            $p = Start-Process build\WinMorph.exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "screenshot timeout: $a" }
            if ($p.ExitCode -ne 0) { throw "screenshot failed: $a" }
          }
          $looks = "win10","win7","xp","win95","macos","ubuntu","debian","arch","mint","chromeos","nova","nexus","terminal","zen","gaming"
          foreach ($lang in "de","en") {
            $dir = "$pwd\shots\$lang"
            New-Item -ItemType Directory -Force $dir | Out-Null
            foreach ($l in $looks) {
              Shot "--shell-preview", $l, "$dir\$l.png", "--lang", $lang
              Shot "--shell-preview", $l, "$dir\$l-menu.png", "menu", "--lang", $lang
              Shot "--lockscreen-preview", $l, "$dir\lock-$l.png", "--lang", $lang
            }
            foreach ($scene in "matrix","starfield","plexus","radar","bokeh","zen-desk","gaming-desk") {
              Shot "--live-preview", $scene, "$dir\live-$scene.png", "--lang", $lang
            }
            Shot "--screenshot", "$dir\app.png", "terminal", $lang
          }
          Shot "--render-walls", "$pwd\shots\walls"
          Get-ChildItem shots | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/**
          if-no-files-found: ignore

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item Setup/out/WinMorph-Setup.exe "dist/WinMorph-Setup-$v.exe"
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WinMorph-Setup
          path: dist/*

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: WinMorph ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/WinMorph-Setup-${{ steps.ver.outputs.version }}.exe
            dist/SHA256SUMS.txt
          body: |
            ## WinMorph ${{ steps.ver.outputs.version }}

            Windows-Looks per Klick · Windows looks in one click — https://winmorph.benjaminberger.at

            **Download:** `WinMorph-Setup-${{ steps.ver.outputs.version }}.exe` (Windows 10/11, no admin rights needed).
            Standard Inno Setup installer, per user; no look is activated automatically.
            Standard-Installer pro Benutzer; kein Look wird automatisch aktiviert.

            If antivirus blocks this file, keep protection enabled and report the detection:
            https://www.microsoft.com/wdsi/filesubmission

            Installed copies update themselves in the background.

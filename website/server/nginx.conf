# winmorph.benjaminberger.at – behind Cloudflare (wildcard record), served from /var/www/winmorph
server {
    listen 80;
    listen [::]:80;
    server_name winmorph.benjaminberger.at;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name winmorph.benjaminberger.at;

    ssl_certificate /etc/ssl/cloudflare-origin/benjaminberger.at/fullchain.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/benjaminberger.at/privkey.pem;
    include /etc/nginx/snippets/tls-settings.conf;
    ssl_dhparam /etc/ssl/dhparams.pem;
    include snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/winmorph.benjaminberger.at.access.log;
    error_log /var/log/nginx/winmorph.benjaminberger.at.error.log;

    root /var/www/winmorph/repo/website/public;
    index index.html;
    error_page 404 /404.html;
    include snippets/winmorph-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # newest release, read by the download button and by WinMorph's updater
    location = /api/release {
        alias /var/www/winmorph/data/release.json;
        default_type application/json;
        include snippets/winmorph-headers.conf;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /download/setup {
        alias /var/www/winmorph/data/WinMorph-Setup.exe;
        default_type application/vnd.microsoft.portable-executable;
        include snippets/winmorph-headers.conf;
        add_header Content-Disposition 'attachment; filename="WinMorph-Setup.exe"' always;
        add_header Cache-Control "no-store" always;
    }

    location /fonts/ { expires 1y; }
    location /shots/ { expires 1d; }
    location ~ ^/(style\.css|app\.js|boot\.js|404\.js)$ { expires 5m; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
